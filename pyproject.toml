[project]
name = "potato-gateway"
version = "0.2.0"
description = "Minimal Potato Hub gateway API for GPT Actions, Hermes Agent, and Codex."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
potato-gateway = "potato_gateway.main:main"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
